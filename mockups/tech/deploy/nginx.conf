# Replace retrotech.example with your domain or VPS IP before enabling.
# This server block belongs inside Nginx's http context (sites-enabled/conf.d).
server {
    listen 80;
    server_name retrotech.example;

    root /var/www/retrotech;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # New deploys must be visible immediately; hashed assets remain cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Missing images must return 404, never the SPA HTML document.
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
