# Blog Engine v1: historical MVP baseline merged with the Files and Avatars delta.
openapi: 3.1.0
info:
  title: Blog Engine MVP
  version: 1.0.0
  description: Blog Engine v1, including files, publication media and avatars. Clients use Blog API URLs for
    bytes. See frontend-api-spec.md for wire conventions.
servers:
- url: /
  description: Current installation; no production endpoint implied.
security:
- Bearer: []
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Resolve the current local user and effective roles
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: &id001
            Cache-Control: &id003
              schema:
                type: string
                const: private, no-store
            Vary: &id004
              schema:
                type: string
                const: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Creates exactly one local issuer+sub mapping if absent; Reader is implicit. No HTTP role
        mutation.
      x-request-body: must be absent
  /api/v1/publications:
    get:
      operationId: listPublications
      summary: Page through Published publications
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: 'Recent: firstPublishedAt DESC,id DESC. Popular: likeCount DESC,firstPublishedAt DESC,id
        DESC. Does not register views. Never returns Markdown. Empty existing filters yield empty page; unknown
        filter ID=400.'
      parameters:
      - &id005
        $ref: '#/components/parameters/Page'
      - &id006
        $ref: '#/components/parameters/PageSize'
      - name: categoryIds
        in: query
        style: form
        explode: true
        schema:
          type: array
          items: &id002
            type: string
            format: uuid
          minItems: 0
          maxItems: 5
          uniqueItems: true
        description: Repeated parameter. Any chosen category AND all chosen tags. Unknown/duplicate IDs=400.
      - name: tagIds
        in: query
        style: form
        explode: true
        schema:
          type: array
          items: *id002
          minItems: 0
          maxItems: 20
          uniqueItems: true
        description: Repeated parameter; every chosen tag must match. Unknown/duplicate IDs=400.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recent
          - popular
          default: recent
      x-request-body: must be absent
    post:
      operationId: createPublication
      summary: Create own Draft
      security:
      - Bearer: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control: *id003
            Vary: *id004
            Location:
              schema:
                type: string
                format: uri-reference
              description: URI of the created resource or authorized edit context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePublication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-authorization: Author or Admin; owner from verified local identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationWrite'
  /api/v1/publications/by-slug/{slug}:
    get:
      operationId: getPublicationBySlug
      summary: Read Published publication by permanent slug
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: No view registration. Draft/deleted/absent all 404, including for owner; use workspace for
        private content.
      parameters:
      - name: slug
        in: path
        required: true
        schema: &id008
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Strict canonical slug; no trim/case conversion. Publication slug immutable after first
            publication and permanently reserved after deletion; taxonomy slug immutable after creation.
      x-request-body: must be absent
  /api/v1/publications/{id}:
    get:
      operationId: getPublication
      summary: Read Published publication by ID
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Public only; Draft/deleted/absent all 404 even for owner. No view registration.
      parameters:
      - $ref: '#/components/parameters/Id'
      x-request-body: must be absent
    put:
      operationId: updatePublication
      summary: Replace editable publication fields
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePublication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Published edits are immediately public. After first publication slug and firstPublishedAt
        remain unchanged, including after unpublish. State changed only by explicit commands.
      x-authorization: Own Author or Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationWrite'
    delete:
      operationId: deletePublication
      summary: Permanently make publication and interactions unavailable
      security:
      - Bearer: []
      responses:
        '204':
          description: Success
          headers: *id001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Terminal tombstone reserves slug. Removes taxonomy assignments; no restore. All child reads/writes
        become inaccessible.
      x-authorization: Own Author or Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      x-request-body: must be absent
  /api/v1/publications/{id}/publish:
    post:
      operationId: publishPublication
      summary: Publish own publication
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePublication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Requires nonblank Markdown; firstPublishedAt assigned once. Re-publish retains first timestamp.
        Current-version command already in desired state succeeds unchanged; stale version still conflicts.
      x-authorization: Own Author or Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      x-request-body: must be absent
  /api/v1/publications/{id}/unpublish:
    post:
      operationId: unpublishPublication
