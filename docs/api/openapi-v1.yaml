      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    put:
      operationId: putMediaUploadContent
      summary: Upload exact bytes through Blog
      description: Check ownership, effective expiry and state before reading the octet-stream body. An active
        transfer gives 409 upload_in_progress. Processing and terminal states, including effective Expired,
        give 409 invalid_state. Active ordinary uploads require the current Author or Admin role for a new
        PUT claim or replay. Role denial gives 403 without a state or quota change. A claim admitted before
        revocation may stage bytes; complete and the Ready transition recheck local roles. The API body ceiling
        is set by purpose (50/10/5 MiB), independent of declaredSize, including chunked bodies. For a new fenced
        transfer in AwaitingContent, exceeding the ceiling gives 413 request_too_large and a complete body
        within the ceiling with a mismatched declaredSize gives 400 validation_failed. Both reject the upload
        and release the reservation atomically. An interrupted or failed body read remains retryable unless
        a size violation has already been established. In ContentReceived, identical length and SHA-256 give
        204, different length or hash within the ceiling gives 409 content_conflict, and exceeding the ceiling
        gives 413 request_too_large. All three outcomes preserve the accepted bytes, state and reservation.
        A proxy or transport rejection before the API sees the request leaves the upload unchanged and may
        use a different response format. Read the existing upload with GET, then retry or cancel it as appropriate.
