        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Returns Draft; discussion and reactions retained but inaccessible publicly. Current-version
        command already in desired state succeeds unchanged; stale version still conflicts.
      x-authorization: Own Author or Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      x-request-body: must be absent
  /api/v1/workspace/publications:
    get:
      operationId: listWorkspacePublications
      summary: Page through own materials, or all for Admin
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: updatedAt DESC,id DESC. Includes version and state, no Markdown; deleted rows excluded.
      x-authorization: 'Author: own; Admin: all; Moderator alone forbidden'
      parameters:
      - *id005
      - *id006
      - name: state
        in: query
        schema:
          type: string
          enum:
          - Draft
          - Published
      x-request-body: must be absent
  /api/v1/workspace/publications/{id}:
    get:
      operationId: getWorkspacePublication
      summary: Read authorized editing representation
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePublication'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Includes Draft and version. Foreign Draft/absent/deleted 404; published foreign edit-context
        403.
      x-authorization: Own Author or Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      x-request-body: must be absent
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List categories
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: name COLLATE C ASC,id ASC. Immutable slug; version supports Admin rename/delete.
      parameters: &id007
      - *id005
      - *id006
      x-request-body: must be absent
    post:
      operationId: createCategory
      summary: Create category
      security:
      - Bearer: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control: *id003
            Vary: *id004
            Location:
              schema:
                type: string
                format: uri-reference
              description: URI of the created resource or authorized edit context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-authorization: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyCreate'
  /api/v1/categories/{id}:
    get:
      operationId: getCategory
      summary: Read category
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'
        '400':
