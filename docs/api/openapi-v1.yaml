    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - Attachment
          - PublicationImage
          - Avatar
        name:
          type: string
          description: Reject Unicode Cc, U+002F and U+005C in the input. Strip surrounding Unicode White_Space,
            then require 1 to 255 Unicode scalars. Reject dot, dot-dot and an ASCII letter followed by a colon
            at the start of the normalized name. This is the display and download name.
        declaredSize:
