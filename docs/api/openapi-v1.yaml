components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External Identity RS256 access JWT; exact configured issuer/audience and local roles. See
        operations.md.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Valid pages beyond the collection return empty items and hasNextPage=false. Checked int64
        offset.
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Version:
      name: X-Resource-Version
      in: header
      required: true
      schema: *id002
      description: Opaque edit version from prior authorized read. Missing/malformed=400; stale=409. Check
        access before revealing conflicts. No strong ETag semantics; counters do not rotate edit version.
    Id:
      name: id
      in: path
      required: true
      schema: *id002
    CommentId:
      name: commentId
      in: path
      required: true
      schema: *id002
    AnonymousVisitor:
      name: X-Anonymous-Visitor
      in: header
      required: false
      schema:
        type: string
      description: Engine-issued anonymous token. Absent/unusable/over256 characters creates a new token; ignored
        for valid Bearer. No cookies; not an account credential. HTTP server header envelope limits remain
        applicable.
