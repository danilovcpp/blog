      - $ref: '#/components/parameters/Id'
      x-request-body: must be absent
    put:
      operationId: renameCategory
      summary: Rename category
      security:
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Slug is immutable; new name appears in associated materials.
      x-authorization: Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyRename'
    delete:
      operationId: deleteCategory
      summary: Delete unused category
      security:
      - Bearer: []
      responses:
        '204':
          description: Success
          headers: *id001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Any remaining publication assignment =>409 taxonomy_in_use.
      x-authorization: Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
      x-request-body: must be absent
  /api/v1/tags:
    get:
