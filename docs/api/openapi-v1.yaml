  responses:
    Error400:
      headers: *id001
      description: validation_failed or invalid_request; field errors for invalid values, unknown fields or
        malformed JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: authentication_required when Bearer is absent on a protected operation; invalid_token for
        a supplied invalid token or unknown key after successful JWKS refresh. No anonymous fallback.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge without sensitive error details.
        Cache-Control: *id003
        Vary: *id004
    Error403:
      headers: *id001
      description: forbidden; verified identity lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      headers: *id001
      description: resource_not_found; absent or inaccessible resource. Draft/deleted public lookups are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      headers: *id001
      description: concurrency_conflict, slug_conflict, taxonomy_in_use or invalid_state; no overwrite/partial
        write.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error413:
      headers: *id001
      description: request_too_large; global JSON body limit 8 MiB. Decoded field-size violations are400 validation_failed
        unless the global envelope is exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error415:
      headers: *id001
      description: unsupported_media_type; request body must be application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error500:
      headers: *id001
      description: internal_error; safe details and traceId.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      headers: *id001
      description: dependency_unavailable for database/infrastructure failure; identity_keys_unavailable when
        a required JWKS fetch cannot provide a usable key. Fail closed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
