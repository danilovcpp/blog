              - image/webp
      - if:
          properties:
            purpose:
              const: Avatar
          required:
          - purpose
        then:
          properties:
            declaredSize:
              maximum: 5242880
            declaredContentType:
              enum:
              - image/jpeg
              - image/png
              - image/webp
