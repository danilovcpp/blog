  /api/v1/publications/{id}/comments:
    get:
      operationId: listComments
      summary: Page roots or direct children
      security:
      - {}
      - Bearer: []
      responses:
        '200':
          description: Success
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: Published parent only. createdAt ASC,id ASC. Visible or structural placeholder with visible
        descendants; no whole subtree. Does not register views.
      parameters:
      - $ref: '#/components/parameters/Id'
      - *id005
      - *id006
      - name: parentId
        in: query
        schema: *id002
        description: 'Omitted: roots. Present: direct children of this includable parent in this publication.
          Foreign/absent/non-includable parent=404.'
      x-request-body: must be absent
    post:
      operationId: createComment
      summary: Create immediately Visible comment or reply
      security:
      - Bearer: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control: *id003
            Vary: *id004
            Location:
              schema:
                type: string
                format: uri-reference
              description: URI of the created resource or authorized edit context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEditContext'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
