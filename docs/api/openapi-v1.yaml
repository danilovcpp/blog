    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine code; see operations.md.
          enum:
          - validation_failed
          - invalid_request
          - authentication_required
          - invalid_token
          - forbidden
          - resource_not_found
          - concurrency_conflict
          - slug_conflict
          - taxonomy_in_use
          - invalid_state
          - request_too_large
          - unsupported_media_type
          - method_not_allowed
          - not_acceptable
          - internal_error
          - dependency_unavailable
          - identity_keys_unavailable
          - quota_exceeded
          - idempotency_conflict
          - content_conflict
          - upload_in_progress
          - file_in_use
        detail:
          type: string
          description: Safe description; never SQL, tokens or stack trace.
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 0
      required:
      - type
      - title
      - status
      - code
      - traceId
