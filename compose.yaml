services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: ${BLOG_POSTGRES_DB:?Provide a local database name}
      POSTGRES_USER: ${BLOG_POSTGRES_USER:?Provide a bootstrap username}
      POSTGRES_PASSWORD: ${BLOG_POSTGRES_PASSWORD:?Provide a protected bootstrap password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${BLOG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
