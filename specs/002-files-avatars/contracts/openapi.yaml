openapi: 3.1.0
info:
  title: Blog Engine files and avatars feature delta
  version: 1.1.0-design
  description: Planning artifact, not current runtime capability. Merge into the historical MVP baseline as
    documented in http-api.md. All old operations retained; same-name schemas replaced wholesale. All new responses
    no-store; all errors ProblemDetails. Unknown JSON fields rejected. No cookies or browser-to-Garage access.
x-contract-mode: feature-delta
x-baseline: ../../001-blog-engine-mvp/contracts/openapi.yaml
x-merge-rule: 'Copy baseline; merge paths by path+method and ALL component sections including responses and
  securitySchemes; replace same-name schemas wholesale. Retain all old operations/security and error codes.
  Rewrite delta refs ../../001-blog-engine-mvp/contracts/openapi.yaml#/components/... to local #/components/...
  before publishing a self-contained aggregate at /openapi. Do not extend old additionalProperties:false schemas
  with allOf. Validate raw runtime OpenAPI before documentary overlay.'
servers:
- url: /
  description: Current installation; no production URL implied.
security:
- Bearer: []
paths:
  /api/v1/media/uploads:
    post:
      operationId: createMediaUpload
      summary: Reserve quota and create one upload
      description: Authenticate owner first. Before current role, expiry or current avatar version checks,
        look up owner+Idempotency-Key and compare normalized payload INCLUDING original expected avatar version.
        Exact prior payload returns same historical Upload with201 and no writes, including after role revocation/avatar
        change. Changed payload409 idempotency_conflict. Only a new initialization requires current Author/Admin
        for Attachment/PublicationImage or authenticated self for Avatar, current expected avatar version and
        quota. Owner cannot be supplied.
      responses:
        '201':
          description: Created or same owner/idempotency-key replay; no second reservation.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical upload status URL.
              schema:
                type: string
                format: uri-reference
                description: Blog API URL; never Garage bucket/key or presigned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Owner-scoped. Same payload returns same upload; changed payload409 idempotency_conflict.
      - name: X-Resource-Version
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Required for Avatar. Original version from GET /me/avatar is part of idempotency payload.
          Exact historical replay precedes comparison to current avatar version; new initialization checks
          it and new completion rechecks it at commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
  /api/v1/media/uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: getMediaUpload
      summary: Read own upload status
      description: Owner access persists after Author revocation. For nonterminal active upload, expose effective
        Expired at database now>=expiresAt even before cleanup persists state. Completed/Rejected/Cancelled
        do not age into Expired. Unauthorized request404 without private metadata.
      responses:
        '200':
          description: Current state and immutable result when completed.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: cancelMediaUpload
      summary: Cancel an incomplete own upload
      description: Releases reservation immediately. Completed returns409 invalid_state. A stale worker cannot
        restore cancelled data.
      responses:
        '204':
          description: Cancelled, or already Cancelled/Rejected/Expired.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      x-request-body: must be absent
  /api/v1/media/uploads/{id}/content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    put:
      operationId: putMediaUploadContent
      summary: Upload exact bytes through Blog
      description: Bounded disk spool; enforce actual purpose limit and exact declaredSize, including chunked
        requests. Different bytes after acceptance409 content_conflict; active transfer409 upload_in_progress;
        Processing/Completed replacement409 invalid_state. Transport MIME must be octet-stream. No whole-body
        RAM buffering. Actual-size mismatch or limit violation is terminal Rejected and releases quota immediately;
        an interrupted transfer remains retryable.
      responses:
        '204':
          description: Bytes staged, or exact same length and SHA-256 replay.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 52428800
  /api/v1/media/uploads/{id}/complete:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    post:
      operationId: completeMediaUpload
      summary: Queue processing or retrieve immutable completion
      description: Authenticate owner, then return immutable Completed result BEFORE checking current role,
        original expiry or avatar version; historical replay never reapplies or resurrects content. For a new
        transition, recheck current upload role, expiry and captured avatar version. If current Author/Admin
        rights for an active ordinary upload were revoked, atomically mark Rejected with errorCode forbidden
        and release quota, then return403; worker applies same rule before Ready commit. Before bytes or terminal
        failure409 invalid_state. Avatar conflict leaves prior avatar and releases rejected reservation. Temporary
        storage failure does not create false success.
      responses:
        '200':
          description: Committed immutable historical completion; replay does not reapply.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '202':
          description: Processing; not Ready and avatar not yet changed.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      x-request-body: must be absent
  /api/v1/media/files:
    get:
      operationId: listMediaFiles
      summary: List ready library files
      description: Own prior files remain readable after Author revocation. Admin may select ownerId. No avatar
        files. Beyond-end page empty.
      responses:
        '200':
          description: Ready Attachment and PublicationImage, createdAt DESC,id DESC.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only Admin may select another owner; otherwise current owner.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: ''
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      x-request-body: must be absent
  /api/v1/media/allowance:
    get:
      operationId: getMediaAllowance
      summary: Read logical quota usage
      description: Read logical quota usage
      responses:
        '200':
          description: Used and non-expired reserved bytes.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allowance'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only Admin may select another owner; otherwise current owner.
      x-request-body: must be absent
  /api/v1/media/files/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: getMediaFile
      summary: Read own or Admin ready file metadata
      description: Read own or Admin ready file metadata
      responses:
        '200':
          description: Authorized Ready file metadata.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: deleteMediaFile
      summary: Logically delete an unused file
      description: Any current registration409 file_in_use. Availability and quota change in commit; physical
        cleanup async. Tombstone preserves authorized repeated DELETE; strangers404.
      responses:
        '204':
          description: Logically deleted, or authorized owner/Admin repeat.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      x-request-body: must be absent
  /api/v1/media/files/{id}/content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: downloadPrivateMediaFile
      summary: Download authorized private original or display
      description: Owner/Admin only. Attachment supports original, PublicationImage supports original/display.
        Original forced octet-stream attachment; display PNG. No avatar source route. Missing variant returns404.
        Check current authorization again after spool and integrity verification; unavailable/corrupt authorized
        object503. Range ignored with full200; no304.
      responses:
        '200':
          description: Original bytes or cleaned PNG as selected; verified length/SHA-256 before headers.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Disposition:
              description: attachment; safe ASCII filename and UTF-8 filename*.
              schema:
                type: string
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: variant
        in: query
        required: false
        schema:
          type: string
          enum:
          - original
          - display
          default: original
        description: ''
      x-request-body: must be absent
  /api/v1/publications/{publicationId}/media/{fileId}/content:
    parameters:
    - name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: downloadPublicationMedia
      summary: Read media through its current publication link
      description: Current published article and exact link required for guests/readers. Owner/Admin may access
        Draft. Original variant never accepted. Reauthorize after verified spool before headers; constant URL
        grants no access. No new read after unpublish/link deletion; already-started response may finish. No
        view count increment, no other file usages disclosed. No-store, no304, Range ignored.
      responses:
        '200':
          description: Attachment bytes as octet-stream attachment, or cleaned PNG image as selected.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Disposition:
              description: attachment; safe ASCII filename and UTF-8 filename*.
              schema:
                type: string
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: variant
        in: query
        required: true
        schema:
          type: string
          enum:
          - attachment
          - display
        description: ''
      x-request-body: must be absent
      security:
      - {}
      - Bearer: []
  /api/v1/me/avatar:
    get:
      operationId: getOwnAvatarState
      summary: Read own current or empty versioned avatar state
      description: Read own current or empty versioned avatar state
      responses:
        '200':
          description: A stable non-null version exists even without avatar.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarState'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: deleteOwnAvatar
      summary: Clear own avatar using current version
      description: Any authenticated user; Admin has no other-user override. Stale supplied version409 even
        on lost-response retry; recover by GET. Old avatar immediately loses public access and quota; physical
        cleanup later.
      responses:
        '200':
          description: Current empty avatar state; no-op if already empty at supplied current version.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarState'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      parameters:
      - name: X-Resource-Version
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Current UUID from authorized read, including empty avatar state. Access check precedes
          version validation. Missing/malformed400, stale409.
      x-request-body: must be absent
  /api/v1/avatars/{fileId}/{size}.png:
    parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    - name: size
      in: path
      required: true
      schema:
        type: integer
        enum:
        - 256
        - 512
      description: ''
    get:
      operationId: getPublicAvatarImage
      summary: Read a currently assigned avatar rendition
      description: Only current assignment is publicly readable; old fileId404 immediately after replacement/deletion.
        No-store; no304; Range ignored. Original never exposed. Avatar cache allowance300s is not used by this
        first-stage no-store implementation.
      responses:
        '200':
          description: Newly encoded metadata-free square PNG.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
      security:
      - {}
      - Bearer: []
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External Identity RS256 access JWT; exact configured issuer/audience and local roles. See
        operations.md.
  schemas:
    AvatarRef:
      type: object
      additionalProperties: false
      properties:
        fileId:
          type: string
          format: uuid
        smallUrl:
          type: string
          format: uri-reference
          description: Blog API URL; never Garage bucket/key or presigned URL.
        largeUrl:
          type: string
          format: uri-reference
          description: Blog API URL; never Garage bucket/key or presigned URL.
      required:
      - fileId
      - smallUrl
      - largeUrl
    AvatarState:
      type: object
      additionalProperties: false
      properties:
        fileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        version:
          type: string
          format: uuid
        avatar:
          anyOf:
          - $ref: '#/components/schemas/AvatarRef'
          - type: 'null'
      required:
      - fileId
      - version
      - avatar
    UploadResult:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - Attachment
          - PublicationImage
          - Avatar
        completedAt:
          type: string
          format: date-time
          description: UTC RFC 3339.
        appliedAvatarVersion:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - uploadId
      - fileId
      - purpose
      - completedAt
      - appliedAvatarVersion
      description: Immutable historical outcome. Replay never reassigns an avatar or resurrects a deleted file.
    Upload:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - Attachment
          - PublicationImage
          - Avatar
        name:
          type: string
        declaredSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        declaredContentType:
          type: string
        createdAt:
          type: string
          format: date-time
          description: UTC RFC 3339.
        expiresAt:
          type: string
          format: date-time
          description: UTC RFC 3339.
        state:
          type: string
          enum:
          - AwaitingContent
          - ContentReceived
          - Processing
          - Completed
          - Rejected
          - Cancelled
          - Expired
        result:
          anyOf:
          - $ref: '#/components/schemas/UploadResult'
          - type: 'null'
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - fileId
      - purpose
      - name
      - declaredSize
      - declaredContentType
      - createdAt
      - expiresAt
      - state
      - result
      - errorCode
      description: 'State is effective at database observation time: active uploads become Expired at now>=expiresAt
        without waiting for worker. Completed result remains historical and is not revalidated against current
        roles/avatar/age.'
    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - Attachment
          - PublicationImage
          - Avatar
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: After trim, Unicode scalar count; reject paths, separators and controls.
        declaredSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        declaredContentType:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - purpose
      - name
      - declaredSize
      - declaredContentType
      description: Limits Attachment 52428800, PublicationImage 10485760, Avatar 5242880 bytes. Image MIME
        JPEG/PNG/WebP must match decoded format. Reject unknown fields.
      allOf:
      - if:
          properties:
            purpose:
              const: PublicationImage
          required:
          - purpose
        then:
          properties:
            declaredSize:
              maximum: 10485760
            declaredContentType:
              enum:
              - image/jpeg
              - image/png
              - image/webp
      - if:
          properties:
            purpose:
              const: Avatar
          required:
          - purpose
        then:
          properties:
            declaredSize:
              maximum: 5242880
            declaredContentType:
              enum:
              - image/jpeg
              - image/png
              - image/webp
