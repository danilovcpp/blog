openapi: 3.1.0
info:
  title: Blog Engine Media US1, US2, US3 and US4
  version: 1.0.0
  description: Implemented Phase 6 slice. Final aggregation and consumer activation remain Phase 7.
security:
- Bearer: []
paths:
  /api/v1/media/allowance:
    get:
      operationId: getMediaAllowance
      summary: Read logical quota usage
      description: Read logical quota usage
      responses:
        '200':
          description: Used and non-expired reserved bytes.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allowance'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only Admin may select another owner; otherwise current owner.
      x-request-body: must be absent
  /api/v1/media/uploads:
    post:
      operationId: createMediaUpload
      summary: Reserve quota and create one upload
      description: Authenticate owner first. Before current role, expiry or current avatar version checks, look
        up owner+Idempotency-Key and compare normalized payload INCLUDING original expected avatar version. Exact
        prior payload returns same historical Upload with201 and no writes, including after role revocation/avatar
        change. Changed payload409 idempotency_conflict. Only a new initialization requires current Author/Admin
        for Attachment/PublicationImage or authenticated self for Avatar, current expected avatar version and quota.
        Owner cannot be supplied.
      responses:
        '201':
          description: Created or same owner/idempotency-key replay; no second reservation.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            Location:
              description: Canonical upload status URL.
              schema:
                type: string
                format: uri-reference
                description: Blog API URL; never Garage bucket/key or presigned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Owner-scoped. Same payload returns same upload; changed payload409 idempotency_conflict.
      - name: X-Resource-Version
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Required for Avatar. Original version from GET /me/avatar is part of idempotency payload. Exact
          historical replay precedes comparison to current avatar version; new initialization checks it and new
          completion rechecks it at commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
  /api/v1/media/uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: getMediaUpload
      summary: Read own upload status
      description: Owner access persists after Author revocation. For nonterminal active upload, expose effective
        Expired at database now>=expiresAt even before cleanup persists state. Completed/Rejected/Cancelled do not
        age into Expired. Unauthorized request404 without private metadata.
      responses:
        '200':
          description: Current state and immutable result when completed.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: cancelMediaUpload
      summary: Cancel an incomplete own upload
      description: Releases reservation immediately. Completed returns409 invalid_state. A stale worker cannot restore
        cancelled data.
      responses:
        '204':
          description: Cancelled, or already Cancelled/Rejected/Expired.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      x-request-body: must be absent
  /api/v1/media/uploads/{id}/content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    put:
      operationId: putMediaUploadContent
      summary: Upload exact bytes through Blog
      description: Check ownership, effective expiry and state before reading the octet-stream body. An active transfer
        gives 409 upload_in_progress. Processing and terminal states, including effective Expired, give 409 invalid_state.
        Active ordinary uploads require the current Author or Admin role for a new PUT claim or replay. Role denial
        gives 403 without a state or quota change. A claim admitted before revocation may stage bytes; complete
        and the Ready transition recheck local roles. The API body ceiling is set by purpose (50/10/5 MiB), independent
        of declaredSize, including chunked bodies. For a new fenced transfer in AwaitingContent, exceeding the ceiling
        gives 413 request_too_large and a complete body within the ceiling with a mismatched declaredSize gives
        400 validation_failed. Both reject the upload and release the reservation atomically. An interrupted or
        failed body read remains retryable unless a size violation has already been established. In ContentReceived,
        identical length and SHA-256 give 204, different length or hash within the ceiling gives 409 content_conflict,
        and exceeding the ceiling gives 413 request_too_large. All three outcomes preserve the accepted bytes, state
        and reservation. A proxy or transport rejection before the API sees the request leaves the upload unchanged
        and may use a different response format. Read the existing upload with GET, then retry or cancel it as appropriate.
      responses:
        '204':
          description: Bytes staged, or exact same length and SHA-256 replay.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 52428800
  /api/v1/media/uploads/{id}/complete:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    post:
      operationId: completeMediaUpload
      summary: Queue processing or retrieve immutable completion
      description: Authenticate owner, then return immutable Completed result BEFORE checking current role, original
        expiry or avatar version; historical replay never reapplies or resurrects content. For a new transition,
        recheck current upload role, expiry and captured avatar version. If current Author/Admin rights for an active
        ordinary upload were revoked, atomically mark Rejected with errorCode forbidden and release quota, then
        return403; worker applies same rule before Ready commit. Before bytes or terminal failure409 invalid_state.
        Avatar conflict leaves prior avatar and releases rejected reservation. Temporary storage failure does not
        create false success.
      responses:
        '200':
          description: Committed immutable historical completion; replay does not reapply.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '202':
          description: Processing; not Ready and avatar not yet changed.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
        '413':
          $ref: '#/components/responses/MediaError413'
        '415':
          $ref: '#/components/responses/MediaError415'
      x-request-body: must be absent
  /api/v1/media/files:
    get:
      operationId: listMediaFiles
      summary: List ready library files
      description: Own prior files remain readable after Author revocation. Admin may select ownerId. Returns Attachment
        and PublicationImage only. Each request pages the current sorted set. Empty and beyond-end pages return
        empty items and hasNextPage=false. Inserts or removals between requests can shift page membership.
      responses:
        '200':
          description: Ready Attachment and PublicationImage, createdAt DESC,id DESC.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only Admin may select another owner; otherwise current owner.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          default: 1
        description: One-based page number. An invalid value gives 400 validation_failed.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum items per page. An invalid value gives 400 validation_failed.
      x-request-body: must be absent
  /api/v1/media/files/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: getMediaFile
      summary: Read own or Admin ready file metadata
      description: Read Ready Attachment or PublicationImage metadata as owner or Admin. Avatar IDs return 404.
      responses:
        '200':
          description: Authorized Ready file metadata.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: deleteMediaFile
      summary: Logically delete an unused Attachment or PublicationImage
      description: A current publication link gives 409 file_in_use. Availability and quota change in the same commit.
        Physical cleanup is asynchronous. A tombstone for Attachment or PublicationImage supports repeat DELETE
        by the owner or Admin. Avatar IDs, including tombstones, return 404 to every caller. Delete a current own
        avatar with the versioned DELETE /me/avatar operation.
      responses:
        '204':
          description: Logically deleted, or authorized owner/Admin repeat.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      x-request-body: must be absent
  /api/v1/media/files/{id}/content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: downloadPrivateMediaFile
      summary: Download authorized private original or display
      description: Owner or Admin only. Attachment supports original and PublicationImage supports original or display.
        Original is served as an octet-stream attachment and display as PNG. An unavailable variant or Avatar ID
        returns 404. Recheck current access after the object read attempt before both binary success and a classified
        storage, spool or integrity error. If the file was deleted or access changed, return 404. A read failure
        for a still-authorized object gives 503 dependency_unavailable. Range is ignored.
      responses:
        '200':
          description: Original bytes or cleaned PNG as selected; verified length/SHA-256 before headers.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Disposition:
              description: attachment; safe ASCII filename and UTF-8 filename*.
              schema:
                type: string
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: variant
        in: query
        required: false
        schema:
          type: string
          enum:
          - original
          - display
          default: original
        description: ''
      x-request-body: must be absent
  /api/v1/publications/{publicationId}/media/{fileId}/content:
    parameters:
    - name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    get:
      operationId: downloadPublicationMedia
      summary: Read media through its current publication link
      description: Guests and readers need a currently published article and the exact link. Owner or Admin may
        access a draft. The route serves attachment and display. Recheck current publication access, the link and
        file readiness after the object read attempt before binary success or a classified storage, spool or integrity
        error. Revoked access gives 404, including after unpublish, deletion or link removal. A read failure for
        a still-authorized object gives 503 dependency_unavailable. A response already started may finish. No view
        count increment or disclosure of other file usages. No-store, no 304, Range ignored.
      responses:
        '200':
          description: Attachment bytes as octet-stream attachment, or cleaned PNG image as selected.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Disposition:
              description: attachment; safe ASCII filename and UTF-8 filename*.
              schema:
                type: string
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      parameters:
      - name: variant
        in: query
        required: true
        schema:
          type: string
          enum:
          - attachment
          - display
        description: ''
      x-request-body: must be absent
      security:
      - {}
      - Bearer: []
  /api/v1/me/avatar:
    get:
      operationId: getOwnAvatarState
      summary: Read own current or empty versioned avatar state
      description: Read own current or empty versioned avatar state
      responses:
        '200':
          description: A stable non-null version exists even without avatar.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarState'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
    delete:
      operationId: deleteOwnAvatar
      summary: Clear own avatar using current version
      description: Any authenticated user; Admin has no other-user override. Stale supplied version409 even on lost-response
        retry; recover by GET. Old avatar immediately loses public access and quota; physical cleanup later.
      responses:
        '200':
          description: Current empty avatar state; no-op if already empty at supplied current version.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarState'
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
        '409':
          $ref: '#/components/responses/MediaError409'
      parameters:
      - name: X-Resource-Version
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Current UUID from authorized read, including empty avatar state. Access check precedes version
          validation. Missing/malformed400, stale409.
      x-request-body: must be absent
  /api/v1/avatars/{fileId}/{size}.png:
    parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque UUID. Unauthorized and absent resources are indistinguishable404.
    - name: size
      in: path
      required: true
      schema:
        type: integer
        enum:
        - 256
        - 512
      description: ''
    get:
      operationId: getPublicAvatarImage
      summary: Read a currently assigned avatar rendition
      description: The public URL serves a rendition of the current assignment. Recheck the assignment after the
        object read attempt before binary success or a classified storage, spool or integrity error. Replacement
        or deletion gives 404 for the old fileId immediately after commit. A read failure for a still-current assignment
        gives 503 dependency_unavailable. No-store, no 304, Range ignored.
      responses:
        '200':
          description: Newly encoded metadata-free square PNG.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Length:
              description: Full verified byte length of the selected object; not caller-declared source length.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MediaErrorDefault'
        '400':
          $ref: '#/components/responses/MediaError400'
        '401':
          $ref: '#/components/responses/MediaError401'
        '403':
          $ref: '#/components/responses/MediaError403'
        '404':
          $ref: '#/components/responses/MediaError404'
        '406':
          $ref: '#/components/responses/MediaError406'
        '503':
          $ref: '#/components/responses/MediaError503'
      x-request-body: must be absent
      security:
      - {}
      - Bearer: []
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External Identity RS256 access JWT; exact configured issuer/audience and local roles. See operations.md.
  schemas:
    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - Attachment
          - PublicationImage
          - Avatar
        name:
          type: string
          description: Reject Unicode Cc, U+002F and U+005C in the input. Strip surrounding Unicode White_Space,
            then require 1 to 255 Unicode scalars. Reject dot, dot-dot and an ASCII letter followed by a colon at
            the start of the normalized name. This is the display and download name.
        declaredSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        declaredContentType:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - purpose
      - name
      - declaredSize
      - declaredContentType
      description: Limits Attachment 52428800, PublicationImage 10485760, Avatar 5242880 bytes. Image MIME JPEG/PNG/WebP
        must match decoded format. Reject unknown fields.
      allOf:
      - if:
          properties:
            purpose:
              const: PublicationImage
          required:
          - purpose
        then:
          properties:
            declaredSize:
              maximum: 10485760
