        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: name COLLATE C ASC,id ASC. Immutable slug; version supports Admin rename/delete.
      parameters: &id007
      - *id005
      - *id006
      x-request-body: must be absent
    post:
      operationId: createCategory
      summary: Create category
      security:
      - Bearer: []
      responses:
        '201':
          description: Success
