          schema:
            $ref: '#/components/schemas/Problem'
    Error413:
      headers: *id001
      description: request_too_large; global JSON body limit 8 MiB. Decoded field-size violations are400 validation_failed
        unless the global envelope is exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error415:
      headers: *id001
      description: unsupported_media_type; request body must be application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error500:
      headers: *id001
      description: internal_error; safe details and traceId.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      headers: *id001
      description: dependency_unavailable for database/infrastructure failure; identity_keys_unavailable when a
        required JWKS fetch cannot provide a usable key. Fail closed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
