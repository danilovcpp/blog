      description: validation_failed or invalid_request; field errors for invalid values, unknown fields or malformed
        JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: authentication_required when Bearer is absent on a protected operation; invalid_token for a supplied
        invalid token or unknown key after successful JWKS refresh. No anonymous fallback.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge without sensitive error details.
        Cache-Control: *id003
        Vary: *id004
    Error403:
      headers: *id001
      description: forbidden; verified identity lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      headers: *id001
      description: resource_not_found; absent or inaccessible resource. Draft/deleted public lookups are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      headers: *id001
      description: concurrency_conflict, slug_conflict, taxonomy_in_use or invalid_state; no overwrite/partial write.
      content:
