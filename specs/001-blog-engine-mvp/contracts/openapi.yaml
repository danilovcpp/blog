        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      description: updatedAt DESC,id DESC. Includes version and state, no Markdown; deleted rows excluded.
      x-authorization: 'Author: own; Admin: all; Moderator alone forbidden'
      parameters:
      - *id005
      - *id006
      - name: state
        in: query
        schema:
          type: string
          enum:
          - Draft
          - Published
      x-request-body: must be absent
  /api/v1/workspace/publications/{id}:
    get:
      operationId: getWorkspacePublication
      summary: Read authorized editing representation
