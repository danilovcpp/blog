        '503':
          $ref: '#/components/responses/Error503'
      description: Any remaining publication assignment =>409 taxonomy_in_use.
      x-authorization: Admin
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
