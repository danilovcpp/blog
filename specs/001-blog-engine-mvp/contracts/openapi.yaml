components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External Identity RS256 access JWT; exact configured issuer/audience and local roles. See operations.md.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Valid pages beyond the collection return empty items and hasNextPage=false. Checked int64 offset.
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Version:
      name: X-Resource-Version
      in: header
      required: true
      schema: *id002
      description: Opaque edit version from prior authorized read. Missing/malformed=400; stale=409. Check access
        before revealing conflicts. No strong ETag semantics; counters do not rotate edit version.
    Id:
      name: id
      in: path
      required: true
      schema: *id002
    CommentId:
      name: commentId
      in: path
      required: true
      schema: *id002
    AnonymousVisitor:
      name: X-Anonymous-Visitor
      in: header
      required: false
      schema:
        type: string
      description: Engine-issued anonymous token. Absent/unusable/over256 characters creates a new token; ignored
        for valid Bearer. No cookies; not an account credential. HTTP server header envelope limits remain applicable.
  schemas:
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine code; see operations.md.
          enum:
          - validation_failed
          - invalid_request
          - authentication_required
          - invalid_token
          - forbidden
          - resource_not_found
          - concurrency_conflict
          - slug_conflict
          - taxonomy_in_use
          - invalid_state
          - request_too_large
          - unsupported_media_type
          - method_not_allowed
          - not_acceptable
          - internal_error
          - dependency_unavailable
          - identity_keys_unavailable
        detail:
          type: string
          description: Safe description; never SQL, tokens or stack trace.
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 0
      required:
      - type
      - title
      - status
      - code
      - traceId
    AuthorRef:
      type: object
      additionalProperties: false
      properties:
        id: *id002
      required:
      - id
      description: Opaque local author reference, not an Identity subject or profile URL. Public profile endpoints
        are outside MVP.
    Taxonomy:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: &id009
          type: string
          minLength: 1
          maxLength: 80
